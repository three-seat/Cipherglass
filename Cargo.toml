[workspace]
resolver = "3"
members = [
    "crates/cipherglass-core",
    "crates/cipherglass-js",
    "crates/cipherglass-graphql",
    "crates/cipherglass",
    "crates/cipherglass-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/three-seat/Cipherglass"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# print!/println! panic when stdout is closed; write through a handled
# io::Result instead (exit 2 on failure).
[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
